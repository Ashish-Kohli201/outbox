name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
